services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${Password}
      - TZ=America/Lima
    ports:
      - "1435:1433"
    volumes:
      - sqldata:/var/lib/mssql/data
      - ./Base de Datos/App_Restaurantes.sql:/init.sql
      - ./init.sh:/init.sh
    command: >
      bash -c "(/init.sh &) && /opt/mssql/bin/sqlservr"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__Database=${Db_Connection}
      - BlobStorage__ConnectionString=${BlobStorage_Connection}
      - TZ=America/Lima
    depends_on:
      - sqlserver:
        condition: service_healthy

volumes:
  sqldata: